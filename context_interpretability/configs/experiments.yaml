# Unified configuration for the context-saturation interpretability framework.
# Values here are the spec defaults; run_experiment.py deep-merges CLI overrides
# and per-model capability files (configs/models/*.yaml) on top.

output_root: logs/experiments/context_interpretability
seed: 42
horizon: 64
batch_size: 32               # safe long-context baseline for the 28 GB runner
# Keep approximately batch_size * reference_context input timesteps in each
# GPU microbatch. This raises occupancy for short contexts without increasing
# the known-safe batch at long contexts. Fixed-native-width models are exempt.
dynamic_batching:
  enabled: true
  reference_context: 8192
  # Autotuning probes geometrically up to this ceiling and backs off on OOM.
  # This is a search bound, not an allocation made up front.
  max_batch_size: 4096
max_samples: 256            # per dataset; subsampling is recorded in run_meta

# Primary loss metric — must match the main forecasting evaluation. MASE here is
# the per-instance gluonts-port definition (experiments.gifteval_mase); on the
# synthetic pools season_length=1 (naive) unless the dataset declares one.
primary_metric: mae
extra_metrics: [mse, smape]

# Requested context lengths (spec §3.2). Before execution each value is
# (a) dropped if larger than the model-supported context, (b) aligned DOWN to
# the model patch length; requested + effective are both recorded.
context_lengths: [32, 48, 64, 96, 128, 192, 256, 384, 512, 768,
                  1024, 1536, 2048, 2560, 3072, 4096, 6144, 8192]

# Temporal blocks (spec §3.3). model_patch is used whenever the model patches;
# fixed_length is the fallback (and the forced mode when block_mode says so).
block_mode: model_patch     # model_patch | fixed_length
block_length: 32            # used by fixed_length (and by patchless models)
perturb_partial_patches: false
max_blocks_per_context: 64  # cap on evaluated blocks per context length; the
                            # block list is thinned geometrically (recent blocks
                            # kept dense) and the thinning recorded in run_meta.

experiments:                # which experiments run by default
  exp0_attention_masking: true
  exp1_perturbation: true
  exp2_activation_patching: true
  exp3_forecast_lens: true
  exp4_synthetic_controls: true
  exp5_integrated_gradients: true
  # These additions require either a trained predictor checkpoint (exp6) or
  # several extra TSFM forwards (exp7), so opt in explicitly for existing runs.
  exp6_predictor_contrast_saliency: false
  exp7_context_decomposition: false
  exp8_tsfm_contrast_saliency: false

perturbation:               # Experiment 1 (spec §4)
  methods: [block_mean, permutation, matched_block, noise]
  # Queue several variants per adapter call. This removes CPU/dispatch gaps
  # between the many short GPU microbatches in exp1 (and exp1 inside exp4).
  interventions_per_call: 8
  mean_scope: block         # block | context (context-wide channel mean)
  noise_scales: [0.1, 0.5, 1.0]
  noise_std_floor: 1.0e-3
  n_seeds: 3                # perturbation seeds for stochastic methods
  matched:                  # preferred matching order (spec §4.2C)
    same_series_tolerance: 0.25   # relative mean/var match tolerance
    fallback: other_series        # other_series | seasonal_phase

attention_masking:          # Experiment 0 (spec §9)
  # visible lengths come from context_lengths (every grid value < the cell's
  # full context length); nothing else to configure.
  enabled: true

activation_patching:        # Experiment 2 (spec §5)
  corruption: permutation   # permutation | matched_block (NEVER noise, §5.4)
  granularity: [block_token, forecast_token]
  pilot_samples: 32         # phase 1: all layers on this many samples
  layers: all               # all | every:<k> | [names] — phase-2 layer set
  full_layers: every:2      # representative layers for the full subset

forecast_lens:              # Experiment 3 (spec §6)
  stability_tau: 0.05       # normalized-distance threshold for the
                            # saturation-layer curve (reported in norm units)

integrated_gradients:       # Experiment 5 (spec §8)
  steps: 64
  batch_size: 16
  convergence_steps: [16, 32, 64]
  internal_batch_size: 8
  baselines: [context_mean, zero_after_norm, random_sample]
  n_random_baselines: 3
  target: mean_forecast     # mean_forecast | horizon_step:<h> | loss
  supplementary_loss_target: true

# Experiment 6: explain why the learned predictor prefers one curve point over
# another. The default checkpoint path is
# logs/experiments/context_length_predictor/<model display>/; override it for
# v3/v4 or classification predictors. ``predictor_dir`` may also be a mapping
# keyed by model display or family.
predictor_contrast_saliency:
  predictor_dir: null
  predictor_root: logs/experiments/context_length_predictor
  # With null endpoints, use the smallest/largest checkpoint window. A list of
  # explicit [short, long] pairs takes precedence.
  short_window: null
  long_window: null
  window_pairs: null
  steps: 64
  baselines: [zero, random_sample]
  n_random_baselines: 3
  max_blocks: 64

# Experiment 7: masking/slicing decomposition. By default only the largest W is
# used, avoiding an O(K^2) sweep. ``all_full_contexts: true`` enables every
# nested W; ``full_contexts``/``visible_lengths`` can select exact grid points.
context_decomposition:
  metrics: [mae, mse]
  all_full_contexts: false
  full_contexts: null
  visible_lengths: null

# Experiment 8: direct TSFM saliency for realised forecast-loss contrast.
# The long input is the common differentiable variable; the short branch sees
# its suffix. Currently capability-gated to PatchTST-FM, the only adapter with a
# differentiable forecasting wrapper.
tsfm_contrast_saliency:
  metrics: [mae, mse]
  short_window: null
  long_window: null
  window_pairs: null
  steps: 64
  batch_size: 8
  baselines: [context_mean, random_sample]
  n_random_baselines: 3

synthetic_controls:         # Experiment 4 (spec §7)
  n_instances: 128
  # Exp4 only needs to test whether context reaches the largest planted lag.
  # Keep a 4x margin beyond d_max without paying for the global 8192 grid.
  series_length: 1024
  context_lengths: [16, 32, 48, 64, 96, 128, 192, 256, 384, 512, 1024]
  local_order: 8            # r — local dependency length
  local_kinds: [linear, nonlinear, seasonal]
  distant_kind: linear      # linear | sin (g in f(local) + strength*g(X_{t-d}))
  distant_lags: [32, 64, 128, 256]
  dependency_strengths: [0.0, 0.5, 1.0]
  noise_levels: [0.1]       # core grid; robustness noises are anchor-only below
  noise_robustness:
    lag: 128
    strength: 1.0
    extra_noise_levels: [0.05, 0.25]
  family_c_fraction_distant: 0.5
  oracle_ridge_alpha: 1.0
  # Cheap primary methods run on every control. Expensive methods run only at
  # the zero/maximum-strength, shortest/longest-lag sentinel cells.
  run_methods: [perturbation, attention_masking]
  sentinel_methods: [activation_patching, integrated_gradients]
  sentinel_lags: [32, 256]
  sentinel_strengths: [0.0, 1.0]
  sufficient_context_tolerance: 0.05   # err <= (1+tol)*min(err) => sufficient

analysis:
  bootstrap_samples: 2000
  alpha: 0.05
  multiple_comparison: benjamini_hochberg
  top_k_blocks: 5           # rank-agreement k for the cross-method comparison

datasets:                   # data sources for exp0/1/2/3/5
  source: synthetic         # synthetic | gifteval
  synthetic:
    n_series: 256
    seed: 42
  gifteval:                 # used when source == gifteval (server only)
    datasets: [ETTh1, ETTh2, us_births/D]
    term: short
